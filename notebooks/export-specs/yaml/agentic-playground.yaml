scenarios:
  - id: north_balanced
    state:
      region: North
      window: 6
      demand_bias: 0
      scenario_name: north_balanced
      region_picker.value: North
      mode_picker.value: balanced
  - id: coast_surge
    state:
      region: Coast
      window: 5
      demand_bias: 7
      scenario_name: coast_surge
      region_picker.value: Coast
      mode_picker.value: surge
  - id: south_conserve
    state:
      region: South
      window:
        type: code
        expression: 3 + 5
      demand_bias: -3
      scenario_name: south_conserve
      region_picker.value: South
      mode_picker.value: conserve
values:
  summary:
    source: summary
    formats:
      json:
        export:
          type: code
          code: |
            import json


            def export(value, ctx, **options):
                blob = ctx.write_blob(
                    "summary.json",
                    json.dumps(value, allow_nan=False, indent=2).encode("utf-8"),
                    media_type="application/json",
                )
                return ctx.artifact(
                    format="playground.summary.json.v1",
                    media_type="application/json",
                    files={"data": blob},
                    entry="data",
                    metadata={
                        "kind": "scenario-summary",
                        "region": value["region"],
                        "mode": value["mode"],
                    },
                )
  records:
    source: rows
    formats:
      json:
        export:
          type: code
          code: |
            import json


            def export(value, ctx, **options):
                blob = ctx.write_blob(
                    "records.json",
                    json.dumps(value, allow_nan=False, indent=2).encode("utf-8"),
                    media_type="application/json",
                )
                return ctx.artifact(
                    format="playground.records.json.v1",
                    media_type="application/json",
                    files={"data": blob},
                    entry="data",
                    metadata={
                        "kind": "timeseries-records",
                        "rows": len(value),
                        "columns": list(value[0]) if value else [],
                    },
                )
  sparkline:
    source: sparkline_svg
    formats:
      svg:
        export:
          type: code
          code: |
            def export(value, ctx, **options):
                blob = ctx.write_blob(
                    "sparkline.svg",
                    value.encode("utf-8"),
                    media_type="image/svg+xml",
                )
                return ctx.artifact(
                    format="playground.sparkline.svg.v1",
                    media_type="image/svg+xml",
                    files={"image": blob},
                    entry="image",
                    metadata={
                        "kind": "sparkline",
                        "viewbox": "0 0 720 240",
                    },
                )
  note:
    source: market_note
    formats:
      html:
        export:
          type: code
          code: |
            def export(value, ctx, **options):
                html = value.text if hasattr(value, "text") else str(value)
                blob = ctx.write_blob(
                    "note.html",
                    html.encode("utf-8"),
                    media_type="text/html",
                )
                return ctx.artifact(
                    format="playground.note.html.v1",
                    media_type="text/html",
                    files={"html": blob},
                    entry="html",
                    metadata={
                        "kind": "marimo-markdown-output",
                    },
                )
