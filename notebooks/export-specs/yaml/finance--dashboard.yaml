scenarios:
  - id: selector_crwv_msft
    inputs:
      symbols:
        - AAPL
        - AMZN
        - CRWV
        - GOOGL
        - MSFT
      interval: 1d
      start: "2025-04-01"
      end: "2026-05-01"
      chart_width: 980
    ui:
      symbols_selector:
        value:
          - CRWV
          - MSFT
    widgets:
      widget:
        widget:
          metric: Close
          mode: absolute
          selected_symbols:
            - CRWV
            - MSFT
  - id: selector_aapl_googl_amzn
    inputs:
      symbols:
        - AAPL
        - AMZN
        - CRWV
        - GOOGL
        - MSFT
      interval: 1d
      start: "2025-04-01"
      end: "2026-05-01"
      chart_width: 980
    ui:
      symbols_selector:
        value:
          - AAPL
          - GOOGL
          - AMZN
    widgets:
      widget:
        widget:
          metric: Close
          mode: change
          selected_symbols:
            - AAPL
            - GOOGL
            - AMZN
  - id: selector_ai_semis
    inputs:
      symbols:
        - NVDA
        - AMD
        - AVGO
        - TSM
        - ASML
      interval: 1d
      start: "2025-11-01"
      end: "2026-05-01"
      chart_width: 980
    ui:
      symbols_selector:
        value:
          - NVDA
          - AMD
          - AVGO
    widgets:
      widget:
        widget:
          metric: High
          mode: change
          selected_symbols:
            - NVDA
            - AMD
            - AVGO
  - id: selector_tsla_focus
    inputs:
      symbols:
        - TSLA
      interval: 1d
      start: "2025-01-01"
      end: "2026-05-01"
      chart_width: 760
    ui:
      symbols_selector:
        value:
          - TSLA
    widgets:
      widget:
        widget:
          metric: Close
          mode: absolute
          selected_symbols:
            - TSLA
values:
  summary:
    source:
      expr: |-
        {
            "rows": df.height,
            "columns": df.columns,
            "symbols": sorted(df["Symbol"].unique().to_list()),
            "date_start": df["Date"].min().strftime("%Y-%m-%d"),
            "date_end": df["Date"].max().strftime("%Y-%m-%d"),
        }
    formats:
      json:
        export:
          type: code
          code: |
            import json


            def export(value, ctx, **options):
                blob = ctx.write_blob(
                    "summary.json",
                    json.dumps(value, allow_nan=False, indent=2).encode(),
                    media_type="application/json",
                )
                return {
                    "format": "summary.json.v1",
                    "media_type": "application/json",
                    "data": {
                        "type": "bundle",
                        "files": {"data": blob},
                        "entry": "data",
                    },
                    "metadata": {"kind": "finance-summary"},
                }
  symbols_selector:
    source:
      expr: |-
        {
            "label": "Select symbols to compare",
            "options": symbols,
            "value": symbols_selector.value,
        }
    formats:
      json:
        export:
          type: code
          code: |
            import json


            def export(value, ctx, **options):
                blob = ctx.write_blob(
                    "symbols-selector.json",
                    json.dumps(value, allow_nan=False, indent=2).encode(),
                    media_type="application/json",
                )
                return {
                    "format": "marimo.selector-state.json.v1",
                    "media_type": "application/json",
                    "data": {
                        "type": "bundle",
                        "files": {"data": blob},
                        "entry": "data",
                    },
                    "metadata": {"kind": "marimo-selector-state"},
                }
  prices:
    source: { def: df }
    formats:
      arrow:
        export:
          type: ref
          ref: moexport.exporters.dataframe:arrow
      parquet:
        export:
          type: ref
          ref: moexport.exporters.dataframe:parquet
  change_desc:
    source:
      cell: change_desc
      output: scenario
    formats:
      html:
        export:
          type: code
          code: |
            def export(value, ctx, **options):
                html = value.text if hasattr(value, "text") else str(value)
                blob = ctx.write_blob(
                    options.get("filename", "change-desc.html"),
                    html.encode("utf-8"),
                    media_type="text/html",
                )
                return {
                    "format": "marimo.cell_output.html.v1",
                    "media_type": "text/html",
                    "data": {
                        "type": "bundle",
                        "files": {"html": blob},
                        "entry": "html",
                    },
                    "metadata": {
                        "kind": "marimo-cell-output",
                        "cell": "change_desc",
                    },
                }
  comparison_chart:
    source: { def: symbols_chart }
    formats:
      vegalite:
        export:
          type: ref
          ref: moexport.exporters.altair:vegalite
      png_nogrid:
        export:
          type: code
          code: |
            import json


            def export(value, ctx, **options):
                import vl_convert

                spec = value.to_dict()
                config = dict(spec.get("config") or {})
                axis = dict(config.get("axis") or {})
                axis["grid"] = False
                config["axis"] = axis
                spec["config"] = config

                scale = options.get("scale", 2)
                blob = ctx.write_blob(
                    "chart-nogrid.png",
                    vl_convert.vegalite_to_png(
                        vl_spec=json.dumps(spec, allow_nan=False),
                        scale=scale,
                    ),
                    media_type="image/png",
                )
                return {
                    "format": "image.png.nogrid.v1",
                    "media_type": "image/png",
                    "data": {
                        "type": "bundle",
                        "files": {"image": blob},
                        "entry": "image",
                    },
                    "metadata": {
                        "source_format": "vegalite.v1",
                        "grid": False,
                        "scale": scale,
                    },
                }
        options:
          scale: 2
  ohlc_dashboard:
    source: { def: widget }
    formats:
      bundle:
        export:
          type: ref
          ref: moexport.exporters.anywidget:bundle
