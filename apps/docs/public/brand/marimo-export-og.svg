<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">marimo-export</title>
  <desc id="description">Turn selected notebook states into verified files for Python, browser, and agent consumers.</desc>
  <rect width="1200" height="630" fill="#171b19"/>
  <rect x="0" y="0" width="1200" height="10" fill="#2a96f2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="84" fill="#cad996" font-size="28" font-weight="700">marimo-export</text>
    <text x="72" y="212" fill="#f4f6f4" font-size="58" font-weight="750">Turn notebook states</text>
    <text x="72" y="282" fill="#f4f6f4" font-size="58" font-weight="750">into verified files.</text>
    <text x="72" y="354" fill="#aeb6b1" font-size="24">Prepare with Python. Open from browsers, agents,</text>
    <text x="72" y="390" fill="#aeb6b1" font-size="24">Python automation, or custom clients.</text>
  </g>
  <g transform="translate(730 130) scale(.72)" fill="none" stroke="#cad996" stroke-width="3">
