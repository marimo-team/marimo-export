    <path d="M75 140v90" stroke-dasharray="8 8"/>
    <path d="M174 185h52"/><path d="m216 175 12 10-12 10"/>
    <rect x="246" y="56" width="150" height="260" rx="16" fill="#202720"/>
    <path d="M321 56v260M246 143h150M246 230h150" opacity=".55"/>
    <path d="M418 185h45"/><path d="m453 175 12 10-12 10"/>
    <rect x="482" y="52" width="92" height="58" rx="11" fill="#202720"/>
    <rect x="482" y="156" width="92" height="58" rx="11" fill="#202720"/>
    <rect x="482" y="260" width="92" height="58" rx="11" fill="#202720"/>
  </g>
  <g transform="translate(730 130) scale(.72)" fill="#edf1ed" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="75" y="98" font-size="18" font-weight="700">notebook</text>
    <text x="75" y="124" font-size="15">Python values</text>
    <text x="75" y="260" font-size="18" font-weight="700">ExportSpec</text>
