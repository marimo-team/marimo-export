    <text x="282" y="107" font-size="15">weekly</text><text x="359" y="107" font-size="15">summary</text>
    <text x="282" y="194" font-size="15">monthly</text><text x="359" y="194" font-size="15">chart</text>
    <text x="282" y="281" font-size="15">custom</text><text x="359" y="281" font-size="15">table</text>
    <text x="528" y="88" font-size="15" font-weight="700">Python</text>
    <text x="528" y="192" font-size="15" font-weight="700">Browser</text>
    <text x="528" y="296" font-size="15" font-weight="700">Agent</text>
