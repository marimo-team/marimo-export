name: Set up JavaScript workspace
description: Install the pinned Node.js toolchain and locked pnpm workspace.

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
      with:
        node-version-file: package.json
        version-file: pnpm-workspace.yaml
        sfw: true
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        run-install: |
          - args: ['--frozen-lockfile']

    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm
