name: Set up JavaScript workspace
description: Install the pinned Node.js toolchain and locked pnpm workspace.

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: package.json
        version-file: pnpm-workspace.yaml
        sfw: true
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        run-install: |
          - args: ['--frozen-lockfile']

    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm
