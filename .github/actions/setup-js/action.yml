name: Set up JavaScript workspace
description: Install the pinned Node.js toolchain and locked pnpm workspace.

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version-file: package.json
        version-file: pnpm-workspace.yaml
        sfw: true
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        run-install: |
          - args: ['--frozen-lockfile']

    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm
