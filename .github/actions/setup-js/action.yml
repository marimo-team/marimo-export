name: Set up JavaScript workspace
description: Install the pinned Node.js toolchain and locked pnpm workspace.

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      with:
        node-version-file: package.json
        version-file: pnpm-workspace.yaml
        sfw: true
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        run-install: |
          - args: ['--frozen-lockfile']

    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm
