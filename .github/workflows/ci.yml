name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      distribution: ${{ steps.filter.outputs.distribution }}
      frontend_contracts: ${{ steps.filter.outputs.frontend_contracts }}
      python_contracts: ${{ steps.filter.outputs.python_contracts }}
      quality: ${{ steps.filter.outputs.quality }}
      release_contracts: ${{ steps.filter.outputs.release_contracts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync --all-packages --all-extras --locked

      - name: Check formatting
        run: |
          make format
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

  test-python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python_contracts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run Python contracts
        if: matrix.os != 'windows-latest'
        run: >-
          uv run
          --frozen
          --isolated
          --no-dev
          --group test
          --all-extras
          --python "${{ matrix.python-version }}"
          pytest -q -n 4
          --dist worksteal --max-worker-restart=0
          -m "not serial and not application"
          --durations=50 packages/python/tests

      - name: Run Python contracts on Windows
        if: matrix.os == 'windows-latest'
        run: >-
          uv run
          --frozen
          --isolated
          --no-dev
          --group test
          --all-extras
          --python "${{ matrix.python-version }}"
          pytest -q -m "not application"
          --durations=50 packages/python/tests

      - name: Run lease timing contracts
        if: matrix.os != 'windows-latest'
        run: >-
          uv run
          --frozen
          --isolated
          --no-dev
          --group test
          --all-extras
          --python "${{ matrix.python-version }}"
          pytest -q -m serial packages/python/tests

      - name: Run application and skill contracts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          make test-application \
            APPLICATION_UV_FLAGS="--frozen --isolated --python ${{ matrix.python-version }}"
          uv run \
            --frozen \
            --isolated \
            --group test \
            --all-extras \
            --python "${{ matrix.python-version }}" \
            pytest -q packages/python/tests/test_scaffold_app.py

  test-frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js

      - name: Test frontend
        run: >-
          ./node_modules/.bin/vp run
          --filter './packages/**'
          --filter './examples/**'
          --fail-if-no-match
          test

      - name: Build frontend
        run: >-
          ./node_modules/.bin/vp run
          --filter './packages/**'
          --filter './examples/**'
          --fail-if-no-match
          build

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync --all-packages --all-extras --locked

      - name: Build and verify packages
        run: make package

  release-contracts:
    name: Release contracts
    needs: changes
    if: needs.changes.outputs.release_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Test release source and publication evidence
        run: uv run --frozen --isolated --no-dev --group test --all-extras --python 3.12 pytest -q
          packages/python/tests/test_release.py

  required:
    name: Required
    if: always()
    needs: [changes, quality, test-python, test-frontend, package, release-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          PACKAGE: ${{ needs.package.result }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.distribution }}
          QUALITY: ${{ needs.quality.result }}
          QUALITY_REQUIRED: ${{ needs.changes.outputs.quality }}
          TEST_FRONTEND: ${{ needs.test-frontend.result }}
          TEST_FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend_contracts }}
          TEST_PYTHON: ${{ needs.test-python.result }}
          TEST_PYTHON_REQUIRED: ${{ needs.changes.outputs.python_contracts }}
          RELEASE_CONTRACTS: ${{ needs.release-contracts.result }}
          RELEASE_CONTRACTS_REQUIRED: ${{ needs.changes.outputs.release_contracts }}
        run: |
          if [ "$CHANGES" != success ]; then
            printf 'Change classification failed: %s\n' "$CHANGES" >&2
            exit 1
          fi
          for stage in QUALITY TEST_PYTHON TEST_FRONTEND PACKAGE RELEASE_CONTRACTS; do
            required="${stage}_REQUIRED"
            case "${!required}" in
              true) expected=success ;;
              false) expected=skipped ;;
              *) printf 'Missing change classification for %s\n' "$stage" >&2; exit 1 ;;
            esac
            if [ "${!stage}" != "$expected" ]; then
              printf '%s returned %s, expected %s\n' "$stage" "${!stage}" "$expected" >&2
              exit 1
            fi
          done
