name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / marimo ${{ matrix.marimo }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        marimo: [locked]
        include:
          - python-version: "3.11"
            marimo: minimum
          - python-version: "3.11"
            marimo: latest-compatible

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run Python contracts
        if: matrix.marimo == 'locked'
        run: >-
          uv run
          --frozen
          --isolated
          --group test
          --all-extras
          --python "${{ matrix.python-version }}"
          pytest -q packages/python/tests
          --ignore packages/python/tests/test_vite_vanilla_example.py

      - name: Resolve latest compatible marimo
        if: matrix.marimo == 'latest-compatible'
        run: uv lock --upgrade-package marimo

      - name: Run latest compatible marimo contracts
        if: matrix.marimo == 'latest-compatible'
        run: >-
          uv run
          --frozen
          --isolated
          --group test
          --all-extras
          --python "${{ matrix.python-version }}"
          pytest -q packages/python/tests
          --ignore packages/python/tests/test_vite_vanilla_example.py

      - name: Run minimum marimo contracts
        if: matrix.marimo == 'minimum'
        run: >-
          uv run
          --frozen
          --isolated
          --with "marimo==0.23.15"
          --group test
          --all-extras
          --python "${{ matrix.python-version }}"
          pytest -q packages/python/tests
          --ignore packages/python/tests/test_vite_vanilla_example.py

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync --all-packages --all-extras --locked

      - name: Install AnyWidget test browser
        run: pnpm --filter @marimo-export/internal-loader-anywidget exec playwright install --with-deps --only-shell chromium

      - name: Run release gate
        run: make check

  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync --package marimo-export --locked

      - name: Validate native Windows reads and managed build
        run: >-
          uv run --package marimo-export pytest -q
          packages/python/tests/test_secure_io.py
          packages/python/tests/test_reader.py
          packages/python/tests/test_managed_server.py::test_managed_initial_autorun_restores_native_cell_cache
