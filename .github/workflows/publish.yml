name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.9"

      - name: Fetch current main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release.sh

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: 0.2.4
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install Python workspace
        run: uv sync --all-packages --all-extras --locked

      - name: Run release gate
        run: make check

      - name: Build release artifacts
        run: make package

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/SHA256SUMS
            dist/npm/*.tgz
            dist/python/*.whl
            dist/python/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/npm/*.tgz
            dist/python/*.whl
            dist/python/*.tar.gz

  publish-npm:
    name: Publish npm packages
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@marimo-team/marimo-export
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Publish npm packages
        run: ./scripts/publish-npm.sh "dist/npm/marimo-team-marimo-export-${GITHUB_REF_NAME#v}.tgz"

  verify-npm:
    name: Verify npm packages
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Verify public npm packages
        run: ./scripts/verify-npm.sh

  publish-pypi:
    name: Publish Python package
    needs: verify-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/marimo-export/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.12.9"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Publish Python package
        run: >-
          uv publish
          --check-url https://pypi.org/simple
          --trusted-publishing always
          dist/python/marimo_export-*.whl
          dist/python/marimo_export-*.tar.gz

  verify-pypi:
    name: Verify Python package
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.12.9"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Verify public Python package
        run: ./scripts/verify-pypi.sh

  release-notes:
    name: Create GitHub release
    needs: [verify-npm, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Create GitHub release
        run: |
          artifacts=(
            dist/SHA256SUMS
            dist/npm/*.tgz
            dist/python/*.whl
            dist/python/*.tar.gz
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "marimo-export $GITHUB_REF_NAME" \
              --verify-tag
            gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
              --generate-notes \
              --title "marimo-export $GITHUB_REF_NAME" \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
