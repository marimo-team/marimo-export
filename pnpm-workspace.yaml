packages:
  - apps/*
  - packages/*
  - examples/*

publicHoistPattern:
  - vue
  - "@vue/*"
  - "@vueuse/*"
  - vitepress

catalogMode: prefer

catalog:
  "@anywidget/types": ^0.4.0
  "@msgpack/msgpack": ^3.1.3
  "@oxlint/plugins": 1.90.0
  "@uwdata/flechette": ^2.5.0
  "@vitest/browser-playwright": 5.0.1
  "@types/node": ^24.13.6
  hyparquet: ^1.31.1
  lz4js: ^0.2.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  playwright: 1.64.1
  portless: 0.15.12
  typescript: ^6.0.3
  vega-embed: ^7.2.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitepress: 2.0.0-alpha.21
  vue: ^3.5.43
  vitepress-mermaid-renderer: 1.2.3
  mermaid: 12.2.0
  knip: 6.43.0
  picomatch: 4.0.7
  yaml: 2.9.1

minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@marimo-team/*"
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - vite-plus

overrides:
  # Vue 3.5 compiler packages require parser 7; revisit with their Babel 8 support.
  "@babel/parser": 7.29.11
  lodash-es: 4.18.1
  nanoid: 3.3.20
  postcss: 8.5.32
  vite: "catalog:"
  vitepress>vite: 8.3.5

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  sharp: true
verifyDepsBeforeRun: install
blockExoticSubdeps: true
trustPolicy: no-downgrade
onlyBuiltDependencies: []
