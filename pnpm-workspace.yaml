packages:
  - apps/*
  - packages/*
  - examples/*

publicHoistPattern:
  - vue
  - "@vue/*"
  - "@vueuse/*"
  - vitepress

catalogMode: prefer

catalog:
  "@anywidget/types": ^0.4.0
  "@msgpack/msgpack": ^3.1.2
  "@oxlint/plugins": 1.80.0
  "@uwdata/flechette": ^2.5.0
  "@vitest/browser-playwright": 4.1.11
  "@types/node": ^24.10.0
  hyparquet: ^1.26.2
  lz4js: 0.2.0
  oxlint: 1.80.0
  oxlint-tsgolint: 7.0.2001
  playwright: 1.62.1
  portless: 0.15.6
  typescript: ^6.0.3
  vega-embed: ^7.1.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vitepress: 2.0.0-alpha.19
  vue: ^3.5.39

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@marimo-team/*"

overrides:
  nanoid: 3.3.18
  postcss: 8.5.26
  vite: "catalog:"
  vitepress>vite: 8.2.2

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  sharp: true
