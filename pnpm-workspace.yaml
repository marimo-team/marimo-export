  "@uwdata/flechette": ^2.5.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^24.10.0
  astro: ^7.0.6
  hyparquet: ^1.26.2
  next: 16.2.10
