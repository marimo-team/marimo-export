packages:
  - apps/*
  - packages/*
  - examples/*

catalogMode: prefer

catalog:
  "@anywidget/types": ^0.4.0
  "@msgpack/msgpack": ^3.1.2
  "@vitest/browser-playwright": 4.1.10
  "@types/node": ^24.10.0
  playwright: 1.61.1
  typescript: ^6.0.3
  vega-embed: ^7.1.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitepress: ^1.6.3
  vue: ^3.5.39

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@marimo-team/*"

overrides:
  vite: "catalog:"
  vitepress>vite: ^5.4.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  sharp: true
