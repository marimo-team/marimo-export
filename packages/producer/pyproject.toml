[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project]
name = "marimo-export"
version = "0.0.0"
description = "Publish portable frontend projections from saved marimo notebooks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marimo Team" }]
requires-python = ">=3.10"
dependencies = ["marimo==0.23.14"]
keywords = ["cache", "export", "marimo", "notebook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
anywidget = ["anywidget~=0.9.21"]
dataframe = ["narwhals>=2", "pyarrow>=15"]
png = ["vl-convert-python>=1.8"]

[dependency-groups]
dev = ["polars==1.40.0"]
