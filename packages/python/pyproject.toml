[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project]
name = "marimo-export"
version = "0.0.0"
description = "Publish selected results from a running marimo notebook."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marimo Team" }]
requires-python = ">=3.10"
dependencies = [
  "marimo @ git+https://github.com/peter-gy/marimo.git@0f5fd5d55b4d65d06a814842af3228f57c8ae9c8",
  "msgspec>=0.20",
  "pydantic>=2,<3",
  "PyYAML>=6.0.1",
]
keywords = ["cache", "export", "marimo", "notebook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
marimo-export = "marimo_export.cli:main"

[project.optional-dependencies]
anywidget = ["anywidget~=0.9.21"]
dataframe = ["narwhals>=2", "pyarrow>=15"]
png = ["vl-convert-python>=1.8"]
