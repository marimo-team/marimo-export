[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project]
name = "marimo-export"
version = "0.0.0"
description = "Publish selected results from a running marimo notebook."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marimo Team" }]
requires-python = ">=3.11"
dependencies = ["marimo>=0.23.15", "msgspec>=0.20", "pydantic>=2,<3", "PyYAML>=6.0.1"]
keywords = ["cache", "export", "marimo", "notebook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
marimo-export = "marimo_export.cli:main"

[project.optional-dependencies]
anywidget = ["anywidget>=0.9,<1"]
charts = ["altair>=5,<7", "vl-convert-python>=1.8"]
parquet = ["pyarrow>=15"]
all = ["altair>=5,<7", "anywidget>=0.9,<1", "pyarrow>=15", "vl-convert-python>=1.8"]
