[build-system]
requires = ["agent-plugins>=0.1.0", "uv_build>=0.11.28,<0.13.0"]
build-backend = "agent_plugins.build.uv_build"

[project]
name = "marimo-export"
version = "0.0.2"
description = "Prepare and read verified exports of selected marimo notebook outputs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "marimo team" }]
requires-python = ">=3.10,<3.15"
dependencies = [
  "agent-plugins>=0.1.0",
  "cryptography==50.0.1",
  "idna==3.19",
  "marimo==0.24.0",
  "msgspec>=0.20",
  "numpy>=1.23.5",
  "packaging==26.3",
  "pydantic>=2,<3",
  "PyYAML>=6.0.1",
]
keywords = ["cache", "export", "marimo", "notebook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://marimo-team.github.io/marimo-export/"
Documentation = "https://marimo-team.github.io/marimo-export/"
Repository = "https://github.com/marimo-team/marimo-export"
Issues = "https://github.com/marimo-team/marimo-export/issues"

[project.scripts]
marimo-export = "marimo_export.cli:main"

[project.entry-points."marimo.kernel.lifespan"]
marimo-export = "marimo_export._marimo.entrypoints:kernel_lifespan"

[project.entry-points."marimo.agent.capability"]
marimo-export = "marimo_export.agent"

[project.optional-dependencies]
anywidget = ["anywidget>=0.9,<1"]
charts = ["altair>=5,<7", "vl-convert-python>=1.8"]
parquet = ["pyarrow>=15"]
all = ["altair>=5,<7", "anywidget>=0.9,<1", "pyarrow>=15", "vl-convert-python>=1.8"]

[tool.agent-plugins]
root = "../.."
