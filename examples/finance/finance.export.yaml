schema: marimo-export.spec.v1
inputs:
  - symbols
  - interval
  - start
  - end
  - chart_width
  - symbols_selector
states:
  baseline: {}
  focus:
    symbols_selector: [MSFT, GOOGL, AMZN]
  compact:
    chart_width: 480
  narrow_universe:
    symbols: [AAPL, MSFT, GOOGL]
    symbols_selector: [AAPL, MSFT]
  short_window:
    start: "2025-04-14"
    end: "2025-04-26"
  weekly:
    interval: 1wk
outputs:
  dashboard:
    source: dashboard
  chart_vegalite:
    source: chart_vegalite
  chart_png:
    source: chart_png
  prices_parquet:
    source: prices_parquet
  prices_arrow:
    source: df
  ohlc_matrix:
    source: ohlc_matrix
  row_count:
    source: row_count
