schema: marimo-export.spec.v1

variants:
  current: {}
  aapl:
    symbol_picker: [AAPL]
  nvda:
    symbol_picker: [NVDA]

outputs:
  summary:
    source: summary
    formats:
      json: {}

  chart:
    source:
      expression: price_chart.properties(width=800)
    formats:
      vegalite: {}
      png:
        options:
          scale: 2

  market_note:
    source:
      cell: market_note
    formats:
      html: {}
