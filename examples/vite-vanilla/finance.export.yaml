schema: marimo-export.spec.v1
inputs:
  - interval
  - symbols_selector
states:
  baseline: {}
  cloud_platforms:
    symbols_selector: [MSFT, GOOGL, AMZN]
  ai_buildout:
    symbols_selector: [CRWV, MSFT, GOOGL]
  full_watchlist:
    symbols_selector: [AAPL, CRWV, MSFT, GOOGL, AMZN]
  weekly_view:
    interval: 1wk
    symbols_selector: [AAPL, CRWV, MSFT, GOOGL, AMZN]
outputs:
  market_explorer:
    source: quote_detail
    exporter: anywidget.bundle
  market_summary:
    source: selected_prices
    exporter:
      name: market_summary:encode
      options:
        currency: USD
  performance_chart:
    source: performance
    exporter: altair.vegalite
  performance_snapshot:
    source: performance
    exporter:
      name: altair.png
      options:
        scale: 2
  price_history:
    source: selected_prices
    exporter:
      name: parquet.table
      options:
        compression: snappy
        filename: price-history.parquet
