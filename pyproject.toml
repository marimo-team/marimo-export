[project]
name = "moxport"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "marimo==0.22.0",
    "pydantic>=2.13.0",
]

[project.scripts]
moxport = "moxport:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "ty>=0.0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
