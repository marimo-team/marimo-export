[tool.uv.workspace]
members = ["examples/vite-vanilla", "packages/python"]

[tool.uv]
constraint-dependencies = ["pymdown-extensions==11.0.1"]

[dependency-groups]
dev = ["packaging==26.3", "ruff>=0.15", "tomli==2.4.1", "ty>=0.0.39"]
test = [
  "jsonschema>=4.23",
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "pytest-timeout>=2.4",
  "pytest-xdist==3.8.0",
]

[tool.pytest.ini_options]
markers = [
  "application: run deterministic notebook application contracts",
  "serial: run lifecycle timing tests without other pytest workers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"marimo._ast" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._cli" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._code_mode" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._config" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._entrypoints" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._messaging" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._plugins" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._runtime" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._save" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._schemas" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._session" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._types" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo._utils" = { msg = "Private marimo imports belong in marimo_export._marimo.compat" }
"marimo_export._marimo.compat" = { msg = "Construct private adapters in marimo_export._marimo composition roots" }

[tool.ruff.lint.per-file-ignores]
"packages/python/src/marimo_export/_marimo/compat/**/*.py" = ["TID251"]
"packages/python/src/marimo_export/_marimo/anywidget.py" = ["TID251"]
"packages/python/src/marimo_export/_marimo/composition.py" = ["TID251"]
"packages/python/src/marimo_export/_marimo/blob.py" = ["TID251"]
"packages/python/src/marimo_export/_marimo/entrypoints.py" = ["TID251"]
"packages/python/src/marimo_export/_marimo/managed_server.py" = ["TID251"]
"packages/python/tests/**/*.py" = ["TID251"]

[tool.ty.src]
include = ["packages/python/src", "packages/python/tests"]
