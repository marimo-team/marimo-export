[tool.uv.workspace]
members = ["packages/python"]

[dependency-groups]
dev = ["ruff>=0.15", "ty>=0.0.39"]
test = ["jsonschema>=4.23", "pytest>=9", "pytest-asyncio>=1.3", "pytest-timeout>=2.4"]
acceptance = [
  "altair==6.0.0",
  "anywidget==0.11.0",
  "marimo>=0.23.15",
  "polars==1.40.0",
  "pyarrow==23.0.1",
  "traitlets==5.14.3",
  "uv>=0.9.21",
  "vl-convert-python>=1.8",
  "yfinance==1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["packages/python/src", "packages/python/tests"]
